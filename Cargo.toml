[package]
name = "deslop-please"
version = "0.1.6"
edition = "2024"
description = "An opinionated linter to remove sloppy code: deep modules, narrow interfaces."
license = "MIT"
repository = "https://github.com/deterministic-machines/deslop-please"
readme = "README.md"
keywords = ["lint", "architecture", "modules", "rust-analyzer"]
categories = ["development-tools", "command-line-utilities"]
# The fixtures under tests/ are Cargo projects of their own; the published crate
# is just the tool.
include = ["/src", "/README.md", "/LICENSE"]

# `cargo binstall deslop-please` fetches the binaries the release workflow builds.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
# Reads `cargo metadata`'s JSON.
serde_json = "1.0.154"

# The Tree-sitter backend: manifests, workspace members' globs, a parallel
# extraction, and the Rust grammar and its query API.
globset = "0.4"
rayon = "1.10"
streaming-iterator = "0.1"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"

[dev-dependencies]
tempfile = "3"

# Its own workspace, also when CI checks it out inside the repository it lints.
[workspace]
