name: release

# To cut a release:
#   1. bump `version` in Cargo.toml (and Cargo.lock), merge to main
#   2. git tag v<version> && git push origin v<version>
# This runs the CI checks, builds the binaries, publishes to crates.io, then
# creates the GitHub release with the binaries attached.
#
# Needs the `CARGO_REGISTRY_TOKEN` repository secret (crates.io API token with
# the publish-update scope; publish-new for the first release).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: tag matches Cargo.toml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: version
        run: |
          version=$(sed -nE 's/^version = "(.*)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    # ci.yml's badge job asks for contents: write; it is skipped for tags, but a
    # called workflow may not ask for more than its caller grants.
    permissions:
      contents: write

  build:
    name: build ${{ matrix.target }}
    needs: [version, ci]
    strategy:
      fail-fast: true
      matrix:
        include:
          # musl: static binaries that run on any Linux distribution.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
          - target: aarch64-apple-darwin
            os: macos-latest
            musl: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ARCHIVE: deslop-please-${{ matrix.target }}-v${{ needs.version.outputs.version }}.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install musl C toolchain
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          target_env="${{ matrix.target }}"
          echo "CC_${target_env//-/_}=musl-gcc" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target ${{ matrix.target }}
          rustup default 1.99.0

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          tar -czf "$ARCHIVE" -C target/${{ matrix.target }}/release deslop-please
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}*
          if-no-files-found: error

  # crates.io first: it cannot be undone, so the GitHub release only appears
  # once the crate is out. Re-running a failed job re-runs only that job.
  crates-io:
    name: publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  github:
    name: GitHub release
    needs: crates-io
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
