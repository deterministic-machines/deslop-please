name: test

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks before it builds anything.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

# Same pin as flake.nix: 1.99.0, minimal profile, plus the components below.
jobs:
  check:
    name: fmt + clippy + test + deslop-please
    runs-on: ubuntu-latest
    # The Java tests download scip-java and build with Maven and Gradle.
    timeout-minutes: 30
    outputs:
      slop: ${{ steps.slop.outputs.message }}
      color: ${{ steps.slop.outputs.color }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rust-src,rust-analyzer,clippy,rustfmt
          rustup default 1.99.0

      - uses: Swatinem/rust-cache@v2

      # The Java tests index Maven and Gradle projects with scip-java. The
      # runner has a JDK, Maven and Gradle.
      - name: Install scip-java
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cs.gz" https://github.com/coursier/coursier/releases/download/v2.1.27/cs-x86_64-pc-linux.gz
          echo "9bf62b300a043260f39bc738ddb90dd02a1d2cc998931251614e1749d3231e07  $RUNNER_TEMP/cs.gz" | sha256sum -c -
          gzip -d "$RUNNER_TEMP/cs.gz"
          chmod +x "$RUNNER_TEMP/cs"
          mkdir -p "$HOME/.local/bin"
          "$RUNNER_TEMP/cs" bootstrap com.sourcegraph:scip-java_2.13:0.12.3 -M com.sourcegraph.scip_java.ScipJava -o "$HOME/.local/bin/scip-java"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --release --locked

      # The last line of the report is `deslop-please: ok` or
      # `deslop-please: N errors, well done!`; it becomes the README badge.
      - name: deslop-please on itself, with no allowlist
        id: slop
        run: |
          set +e
          cargo run --release --locked | tee "$RUNNER_TEMP/slop.txt"
          status=${PIPESTATUS[0]}
          set -e
          case $status in
            0) color=brightgreen ;;
            1) color=red ;;
            *) exit "$status" ;;
          esac
          # CARGO_TERM_COLOR=always colors the report: drop the escapes.
          message=$(tail -n 1 "$RUNNER_TEMP/slop.txt" | sed -E 's/\x1b\[[0-9;]*m//g; s/^deslop-please: //; s/, well done!$//')
          echo "message=$message" >> "$GITHUB_OUTPUT"
          echo "color=$color" >> "$GITHUB_OUTPUT"
          exit "$status"

  # Publishes `slop.json` (a shields.io endpoint) to the `badges` branch, for
  # the README's `slop | ok` badge. Only for main, and kept apart from `check`
  # so the job that builds and runs code never holds a write token.
  badge:
    name: slop badge
    needs: check
    if: >-
      always() && needs.check.outputs.slop != '' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: slop-badge
      cancel-in-progress: false
    steps:
      - name: Push slop.json to the badges branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MESSAGE: ${{ needs.check.outputs.slop }}
          COLOR: ${{ needs.check.outputs.color }}
        run: |
          git init -q badges && cd badges
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          if git fetch -q --depth 1 origin badges; then
            git checkout -q -B badges FETCH_HEAD
          else
            git checkout -q --orphan badges
          fi
          jq -cn --arg message "$MESSAGE" --arg color "$COLOR" \
            '{schemaVersion: 1, label: "slop", message: $message, color: $color}' > slop.json
          cat slop.json
          git add slop.json
          if git diff --cached --quiet; then
            echo "badge unchanged"
            exit 0
          fi
          git commit -q -m "slop: $MESSAGE at $GITHUB_SHA"
          git push -q origin badges
